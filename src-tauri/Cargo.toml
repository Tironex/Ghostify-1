[package]
name = "ghostify-desktop"
description = "Ghostify desktop application (Tauri shell around ghostify-app)"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"
default-run = "ghostify-desktop"

# Not a member of the root workspace: it needs the system WebView libraries to build.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ghostify-app = { path = "../crates/ghostify-app" }
ghostify-core = { path = "../crates/ghostify-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tracing = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
