name: Build Ghostify

# Builds installers for Windows, Linux and macOS on GitHub's own machines, so nothing has to be
# installed locally. Start it by hand: Actions tab -> "Build Ghostify" -> Run workflow.
# Pushing a tag like v0.1.0 builds as well. The installers are attached to a GitHub release,
# which is where `installer.py` downloads them from.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish the build under (for example v0.1.0)"
        required: true
        default: "v0.1.0"
  push:
    tags: ["v*"]

# Publishing the installers as a GitHub release needs write access to the repository.
permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, artifact: ghostify-windows }
          - { name: Linux, os: ubuntu-22.04, artifact: ghostify-linux }
          - { name: macOS, os: macos-latest, artifact: ghostify-macos }
    steps:
      - uses: actions/checkout@v4

      # Browser uploads of many folders often lose files. If a source.zip is in the repository, it
      # is unpacked over the checkout, so the build always sees the complete project.
      - name: Unpack source.zip
        shell: python
        run: |
          import os, zipfile
          if os.path.exists("source.zip"):
              with zipfile.ZipFile("source.zip") as archive:
                  archive.extractall(".")
              print("source.zip unpacked")
          else:
              print("no source.zip, building the files as uploaded")

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/ui/pnpm-lock.yaml

      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> target

      - name: Interface dependencies
        run: pnpm install --frozen-lockfile
        working-directory: packages/ui

      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build desktop app
        run: cargo tauri build
        working-directory: src-tauri

      - name: Build command line tool
        run: cargo build --release -p ghostify-app --bin ghostify

      - name: Collect files
        shell: bash
        run: |
          mkdir -p out release
          cp -r src-tauri/target/release/bundle out/bundle
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/ghostify.exe out/
            cp target/release/ghostify.exe release/ghostify-windows-x64.exe
          else
            cp target/release/ghostify out/
            cp target/release/ghostify "release/ghostify-$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')-$(echo "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
          fi
          find src-tauri/target/release/bundle -type f \( -name '*-setup.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' \) -exec cp {} release/ \;
          ls -la release

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Ghostify ${{ github.event.inputs.tag || github.ref_name }}
          files: release/*
          fail_on_unmatched_files: true
