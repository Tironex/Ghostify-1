[package]
name = "ghostify-plugins"
description = "Plugin system of Ghostify: manifests, permissions, malware scanner, versioned store with crash rollback, bridge methods"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
ghostify-core.workspace = true
ghostify-db.workspace = true
