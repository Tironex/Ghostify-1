[package]
name = "ghostify-themes"
description = "Theme engine of Ghostify: manifests, Spicetify import, safe CSS composition, import/export, live reload"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
ghostify-core.workspace = true
ghostify-db.workspace = true
ghostify-bridge.workspace = true
base64 = "0.23.1"
notify = "8.2.0"
regex = "1.13.1"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
tracing.workspace = true
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }
tempfile.workspace = true

futures-util = "0.3.34"
tokio-tungstenite = "0.30.0"
