[package]
name = "ghostify-bridge"
description = "Local JSON-RPC bridge between Ghostify and the loader running inside Spotify"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
ghostify-core.workspace = true
ghostify-db.workspace = true
futures-util = "0.3.34"
getrandom = "0.4.3"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = "0.30.0"
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
ghostify-patch.workspace = true
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }
