[package]
name = "ghostify-market"
description = "Serverless marketplace: signed static index on GitHub, verified downloads, local search, updates"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "ghostify-registry"
path = "src/bin/ghostify-registry.rs"

[dependencies]
ghostify-core.workspace = true
ghostify-db.workspace = true
ghostify-plugins.workspace = true
ghostify-themes.workspace = true
base64 = "0.23.1"
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
getrandom = "0.4.3"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
tracing.workspace = true
ureq = "3.1.2"
tempfile.workspace = true

[dev-dependencies]
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }
tokio = { workspace = true, features = ["sync"] }
