[workspace]
resolver = "2"
members = ["crates/ghostify-core", "crates/ghostify-db", "crates/ghostify-patch", "crates/ghostify-spotify", "crates/ghostify-bridge", "crates/ghostify-themes", "crates/ghostify-plugins", "crates/ghostify-market", "crates/ghostify-extras", "crates/ghostify-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ghostify/ghostify"
rust-version = "1.85"

[workspace.dependencies]
ghostify-core = { path = "crates/ghostify-core" }
ghostify-db = { path = "crates/ghostify-db" }
ghostify-spotify = { path = "crates/ghostify-spotify" }
ghostify-patch = { path = "crates/ghostify-patch" }
ghostify-bridge = { path = "crates/ghostify-bridge" }
ghostify-themes = { path = "crates/ghostify-themes" }
ghostify-plugins = { path = "crates/ghostify-plugins" }
ghostify-market = { path = "crates/ghostify-market" }
ghostify-extras = { path = "crates/ghostify-extras" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
toml = "0.9"
dirs = "6"
rusqlite = { version = "0.42", features = ["bundled"] }
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = "line-tables-only"
